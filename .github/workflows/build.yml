name: Build

# main -> release builds    (1.0.<run>-<yyyyMMdd>)
# dev  -> nightly builds    (nightly-<run>-<yyyyMMdd>)
# PRs / manual -> local-style builds (local-<yyyyMMdd>), no publishing
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  prepare:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.v.outputs.channel }}
      version: ${{ steps.v.outputs.version }}
      build: ${{ steps.v.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: bash
        run: |
          date=$(date -u +%Y%m%d)
          build=${{ github.run_number }}
          major_minor=$(tr -d '[:space:]' < VERSION)
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "main" ]]; then
            channel=release; version="$major_minor.$build-$date"
          elif [[ "${{ github.event_name }}" == "push" && "${{ github.ref_name }}" == "dev" ]]; then
            channel=nightly; version="nightly-$build-$date"
          else
            channel=local; version="local-$date"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "### Version: $version ($channel)" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/ThixNote.Core.Tests -c Release

  windows:
    name: Windows (${{ matrix.runtime }})
    needs: [prepare, test]
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build setup and portable
        shell: pwsh
        run: ./build/Build-Windows.ps1 -Channel '${{ needs.prepare.outputs.channel }}' -BuildNumber ${{ needs.prepare.outputs.build }} -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: ThixNote-windows-${{ matrix.runtime }}
          path: |
            artifacts/ThixNote-Setup-*.exe
            artifacts/ThixNote-*-portable.zip

  macos:
    name: macOS (${{ matrix.runtime }})
    needs: [prepare, test]
    runs-on: macos-latest
    strategy:
      matrix:
        runtime: [osx-arm64, osx-x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build app bundle, portable zip and DMG
        run: |
          chmod +x build/build-macos.sh
          build/build-macos.sh '${{ needs.prepare.outputs.channel }}' '${{ needs.prepare.outputs.build }}' '${{ matrix.runtime }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ThixNote-macos-${{ matrix.runtime }}
          path: |
            artifacts/ThixNote-*.dmg
            artifacts/ThixNote-*-portable.zip

  publish:
    name: Publish GitHub release
    needs: [prepare, windows, macos]
    if: github.event_name == 'push' && needs.prepare.outputs.channel != 'local'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version='${{ needs.prepare.outputs.version }}'
          if [[ '${{ needs.prepare.outputs.channel }}' == 'release' ]]; then
            tag="v$version"; flags=(--latest)
          else
            tag="$version"; flags=(--prerelease)
          fi
          gh release create "$tag" dist/* --target "${{ github.sha }}" --title "ThixNote $version" \
            --generate-notes "${flags[@]}"
